<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رحلة لغتي | الصف الثاني</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f1;color:#183f36;font:21px/1.9 Tahoma,Arial,sans-serif}main{max-width:820px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:15px}a{color:#176e5b}article{background:white;border-radius:24px;padding:28px;margin:20px 0;box-shadow:0 7px 30px #183f3610}h1{font-size:34px}h2{font-size:27px}button,input,textarea{font:inherit}button{border:2px solid #c7ddd0;background:white;border-radius:15px;padding:12px 18px;cursor:pointer;color:#183f36;min-height:52px}button:hover{background:#edf6ed}button:focus-visible,input:focus-visible{outline:3px solid #b97615}button:disabled{cursor:default;opacity:.7}.primary{background:#176e5b;color:white;border:0}.options{display:grid;gap:12px}.selected{border-color:#176e5b;background:#e6f3e7}input{width:100%;border:2px solid #c7ddd0;border-radius:12px;padding:12px}.feedback{padding:18px;border-radius:15px;background:#edf6ed;margin-top:16px}.wrong{background:#fff1e1}.hint{background:#fff7d9;padding:16px;border-radius:14px}progress{width:100%;accent-color:#176e5b}small{font-size:16px}.passage{background:#f4f7f1;border-right:4px solid #176e5b;padding:18px}nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.correct{color:#176e5b}@media(max-width:500px){main{padding:12px}article{padding:20px}h1{font-size:29px}}@media print{button,header,progress{display:none}article{box-shadow:none}}
</style><main><header><strong>✦ رحلة لغتي</strong><a href="../">اختبار الرياضيات</a></header><div id="app"></div><footer><small>تدريب مبني على نموذجَي الملف المرفق • الصف الثاني • الفصل الأول ١٤٤٨ هـ<br>تُحفظ المحاولة على هذا الجهاز فقط. الأنشطة اليدوية خارج الدرجة الآلية.</small></footer></main><script>
const questions=[{"section":"خريطة الكلمات","prompt":"ما مرادف «تَفَقَّدَ»؟","answers":["تفحص","تفحّص","اطمأن على"],"hint":"المرادف كلمة لها معنى قريب.","explanation":"تفقّد الشيء: تفحّصه واطمأن على حاله.","options":["تفحّص","أهمل","ابتعد"],"form":1},{"section":"خريطة الكلمات","prompt":"ما ضد «تَفَقَّدَ»؟","answers":["أهمل"],"hint":"الضد يحمل المعنى المعاكس.","explanation":"التفقّد عناية، والإهمال ترك العناية.","options":["أهمل","تفحّص","راقب"],"form":1},{"section":"خريطة الكلمات","prompt":"ما مرادف «مَذْعُور»؟","answers":["خائف"],"hint":"تخيّل شخصًا رأى دخان حريق.","explanation":"مذعور تعني خائفًا بشدة.","options":["خائف","سعيد","هادئ"],"form":1},{"section":"خريطة الكلمات","prompt":"ما ضد «مَذْعُور»؟","answers":["مطمئن","آمن"],"hint":"ابحث عن الشعور المعاكس للخوف.","explanation":"المطمئن يشعر بالأمان.","options":["مطمئن","خائف","مفزوع"],"form":1},{"section":"الاستماع","prompt":"لماذا دعا عمار صديقه خالدًا؟","answers":["ليلعب معه بقطاره الجديد"],"hint":"استمع إلى نص الدرس مع ولي الأمر قبل الإجابة.","explanation":"هذا سؤال استماع في الورقة. الإجابة المرجّحة من سياق درس عمار وقطاره هي اللعب بالقطار الجديد؛ يلزم تأكيدها من نص الدرس.","options":["ليلعب معه بقطاره الجديد","ليدرس معه درس الرياضيات"],"manual":true,"form":1},{"section":"الاستماع","prompt":"بمن اتصل فواز؟","answers":["اتصل بالدفاع المدني"],"hint":"راجع فقرة فواز والدخان في النموذج الثاني.","explanation":"تطلب الأم من فواز إبلاغ الدفاع المدني.","options":["اتصل بالدفاع المدني","اتصل بالإسعاف"],"form":1},{"section":"ترتيب الكلمات","prompt":"رتّب: فوازًا / رأى / حزينًا / المعلم","answers":["رأى المعلم فوازا حزينا"],"hint":"ابدأ بالفعل، ثم من قام به، ثم من رآه وحاله.","explanation":"رأى المعلم فوازًا حزينًا.","form":1},{"section":"إكمال الجمل","prompt":"صحب المعلم التلاميذ إلى …","answers":["المكتبة"],"hint":"مكان نجد فيه الكتب.","explanation":"المكتبة هي المكان المناسب لقراءة الكتب.","options":["المكتبة","الحديقة","السوق"],"form":1},{"section":"إكمال الجمل","prompt":"شاهد الجار سيارات …","answers":["الإطفاء"],"hint":"سيارات تساعد في إخماد الحريق.","explanation":"سيارات الإطفاء تُستخدم لإخماد الحرائق.","options":["الإسعاف","الإطفاء","الأجرة"],"form":1},{"section":"ترتيب القصة","prompt":"رتّب: واعتذر إلى خالد / وراحا يلعبان معًا / ندم عمار على تسرعه","answers":["ندم عمار على تسرعه واعتذر إلى خالد وراحا يلعبان معا"],"hint":"الشعور بالندم يسبق الاعتذار، ثم يعود الصديقان للعب.","explanation":"ندم عمار على تسرعه، واعتذر إلى خالد، وراحا يلعبان معًا.","form":1},{"section":"الخط","prompt":"انسخ على ورقة: شكر الجار فوازًا على حسن تصرفه","answers":[],"hint":"انتبه للنقاط والمسافات بين الكلمات، واكتب على السطر.","explanation":"يقارن ولي الأمر الكتابة بالجملة، ويتحقق من وضوح الحروف والنقاط.","manual":true,"form":1},{"section":"الإملاء","prompt":"إملاء النموذج الأول","answers":[],"hint":"اطلب من ولي الأمر إملاء النص الذي يحدده المعلم.","explanation":"الورقة لا تتضمن نص الإملاء؛ لا توجد إجابة آلية أو نص بديل مخترع.","manual":true,"form":1},{"section":"القراءة والظواهر اللغوية","prompt":"استخرج كلمة بها «ال» القمرية","answers":["الأمر","المدني"],"hint":"في اللام القمرية ننطق اللام.","explanation":"«الأمر» و«المدني»: ننطق لام «ال» لأن الهمزة والميم حرفان قمريان.","passage":true,"form":2},{"section":"القراءة والظواهر اللغوية","prompt":"استخرج كلمة بها «ال» الشمسية","answers":["الدفاع"],"hint":"في اللام الشمسية لا ننطق اللام ويُشدّد الحرف التالي.","explanation":"«الدفاع»: الدال حرف شمسي.","passage":true,"form":2},{"section":"القراءة والظواهر اللغوية","prompt":"استخرج كلمة تنتهي بتاء مفتوحة","answers":["قالت"],"hint":"ابحث عن فعل ينتهي بحرف ت.","explanation":"«قالت» تنتهي بحرف ت، وليس ة.","passage":true,"form":2},{"section":"القراءة والظواهر اللغوية","prompt":"استخرج كلمة بها حرف مشدد","answers":["أمي","الأم","أمه","الدفاع"],"hint":"الشدة تعني أن الحرف يُنطق مضاعفًا.","explanation":"مثل «أُمِّي»: الميم مشددة.","passage":true,"form":2},{"section":"القراءة والظواهر اللغوية","prompt":"استخرج كلمة بها تنوين فتح","answers":["دخانا","كثيفا","مذعورا"],"hint":"تنوين الفتح علامته فتحتان.","explanation":"دخانًا، كثيفًا، مذعورًا: كلمات بها تنوين فتح.","passage":true,"form":2},{"section":"القراءة والظواهر اللغوية","prompt":"استخرج كلمة بها مد بالألف","answers":["شاهد","فواز","دخانا","جارهم","مذعورا","قالت","هيا","هاتف"],"hint":"ابحث عن ألف مد قبلها فتحة.","explanation":"مثل «شاهد»: الشين مفتوحة وبعدها ألف مد.","passage":true,"form":2},{"section":"ترتيب الكلمات","prompt":"رتّب: فوازًا / الجار / على / شكر / تصرفه / حسن","answers":["شكر الجار فوازا على حسن تصرفه"],"hint":"ابدأ بـ«شكر»، ثم من شكر، ثم من تلقى الشكر.","explanation":"شكر الجار فوازًا على حسن تصرفه.","form":2},{"section":"تحليل الكلمات","prompt":"حلّل «يمسك» إلى حروف، وافصل بينها بمسافة","answers":["ي م س ك"],"hint":"اكتب الحروف بالترتيب من أول الكلمة إلى آخرها.","explanation":"ي / م / س / ك","form":2},{"section":"تحليل الكلمات","prompt":"حلّل «يلعب» إلى حروف، وافصل بينها بمسافة","answers":["ي ل ع ب"],"hint":"اكتب الحروف بالترتيب من أول الكلمة إلى آخرها.","explanation":"ي / ل / ع / ب","form":2},{"section":"المفردات","prompt":"كلمة «عمار» نوعها؟","answers":["اسم"],"hint":"هل تدل على شخص أم على عمل؟","explanation":"عمار اسم شخص.","options":["اسم","فعل"],"form":2},{"section":"المفردات","prompt":"ما ضد «الجديد»؟","answers":["القديم"],"hint":"ابحث عن المعنى المعاكس.","explanation":"القديم ضد الجديد، والحديث قريب من معناه.","options":["الحديث","القديم"],"form":2},{"section":"المفردات","prompt":"ما معنى «القضبان»؟","answers":["مسار القطار"],"hint":"فكر فيما تسير عليه عجلات القطار.","explanation":"القضبان هي السكة التي يسير عليها القطار.","options":["محطة القطار","مسار القطار"],"form":2},{"section":"المفردات","prompt":"ما جمع «لعبة»؟","answers":["ألعاب"],"hint":"الجمع يدل على أكثر من اثنين.","explanation":"ألعاب جمع، ولعبتان مثنى.","options":["ألعاب","لعبتان"],"form":2},{"section":"المفردات","prompt":"ما مفرد «قصص»؟","answers":["قصة"],"hint":"المفرد يدل على واحدة.","explanation":"قصة مفرد، وقصتان مثنى.","options":["قصة","قصتان"],"form":2},{"section":"الإملاء","prompt":"إملاء النموذج الثاني","answers":[],"hint":"يُملي ولي الأمر النص المقرر، ثم يراجع الكتابة.","explanation":"نص الإملاء غير موجود في الملف؛ هذا نشاط بإشراف ولي الأمر.","manual":true,"form":2}],passage="شاهد فواز دخانًا كثيفًا يتصاعد من منزل جارهم، فأسرع مذعورًا ليخبر أمه بالأمر. قالت الأم: هيا يا فواز، أبلغ الدفاع المدني. فواز: أمي، لا أعرف رقم هاتف الدفاع المدني.";
const app=document.getElementById('app'),key='lughaty-pdf-v1';let index=0,records=[],selected='',hint=false;
const norm=s=>s.normalize('NFKC').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/[،.,؛!?؟/]/g,' ').replace(/\s+/g,' ').trim();
function save(){try{localStorage.setItem(key,JSON.stringify({index,records}))}catch{}}
function welcome(){app.innerHTML='<article><small>لغتي • الصف الثاني الابتدائي</small><h1>نتعلّم، ثم نجيب بثقة 🌿</h1><p>تدريب من نموذجَي الاختبار في الملف: ٢٧ خطوة، منها ٢٣ سؤالًا تُصحّح مباشرة. اطلب تلميحًا قبل الإجابة، واقرأ الشرح بعدها.</p><p>الخط والإملاء وسؤال الاستماع الذي يحتاج نص الدرس تُراجع مع ولي الأمر، ولا تدخل في الدرجة الآلية. لا يوجد مؤقّت.</p><nav><button class="primary" id="start">ابدأ التدريب</button><button id="resume">استأنف المحاولة</button></nav></article>';document.getElementById('start').onclick=()=>{index=0;records=[];save();render()};document.getElementById('resume').onclick=()=>{try{let s=JSON.parse(localStorage.getItem(key));if(s){index=s.index;records=s.records}}catch{}render()}}
function render(){selected='';hint=false;if(index>=questions.length)return results();const q=questions[index],r=records[index];app.innerHTML='<article><small>النموذج '+q.form+' • '+q.section+' • الخطوة '+(index+1)+' من '+questions.length+'</small><progress value="'+index+'" max="'+questions.length+'"></progress><h2>'+q.prompt+'</h2>'+(q.passage?'<p class="passage">'+passage+'</p>':'')+(q.manual?'<p>نشاط بإشراف ولي الأمر — خارج الدرجة الآلية.</p>':q.options?'<div class="options">'+q.options.map((o,i)=>'<button class="option" data-i="'+i+'">'+o+'</button>').join('')+'</div>':'<label for="answer">اكتب الإجابة:</label><input id="answer" autocomplete="off">')+'<nav><button id="hint">💡 ساعدني</button>'+(q.manual?'<button id="check" class="primary">اعرض إرشادات المراجعة</button>':'<button id="check" class="primary">تحقّق من إجابتي</button>')+'</nav><div id="help"></div><div id="feedback" aria-live="polite"></div></article>';
document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{selected=q.options[Number(b.dataset.i)];document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
document.getElementById('hint').onclick=()=>{document.getElementById('help').innerHTML='<p class="hint">'+q.hint+'</p>'};
document.getElementById('check').onclick=()=>{let value=q.manual?'':q.options?selected:document.getElementById('answer').value;if(!q.manual&&!value.trim()){document.getElementById('feedback').textContent='اختر أو اكتب إجابتك أولًا.';return}let ok=q.manual?null:q.answers.some(a=>norm(a)===norm(value));records[index]={value,ok};save();showFeedback(q,records[index])};if(r)showFeedback(q,r);window.scrollTo(0,0)}
function showFeedback(q,r){document.getElementById('check').disabled=true;document.querySelectorAll('.option,input').forEach(x=>x.disabled=true);document.getElementById('feedback').innerHTML='<div class="feedback '+(r.ok===false?'wrong':'')+'"><strong>'+(q.manual?'إرشادات المراجعة':r.ok?'أحسنت! إجابة صحيحة ✓':'لنتعلّم من الإجابة 🌱')+'</strong>'+(!q.manual&&r.ok===false?'<p>الإجابة: '+q.answers[0]+'</p>':'')+'<p>'+q.explanation+'</p></div><nav><button id="next" class="primary">'+(index===questions.length-1?'اعرض النتيجة':'السؤال التالي')+'</button></nav>';document.getElementById('next').onclick=()=>{index++;save();render()}}
function results(){let graded=records.filter(r=>r.ok!==null),correct=graded.filter(r=>r.ok).length;app.innerHTML='<article><h1>أكملت رحلة لغتي! ⭐</h1><h2>'+correct+' / '+graded.length+'</h2><p>هذه نتيجة الأسئلة المصحّحة آليًا فقط. راجع الأنشطة اليدوية مع ولي الأمر.</p><nav><button id="again" class="primary">تدريب جديد</button><button id="print">اطبع النتيجة</button></nav></article>'+questions.map((q,i)=>'<article><small>'+q.section+'</small><h2>'+q.prompt+'</h2><p>'+(q.manual?'مراجعة مع ولي الأمر':records[i]?.ok?'✓ صحيحة':'الإجابة الصحيحة: '+q.answers[0])+'</p><p>'+q.explanation+'</p></article>').join('');document.getElementById('again').onclick=welcome;document.getElementById('print').onclick=()=>window.print();window.scrollTo(0,0)}
welcome();
</script></html>
