name: Provision and verify public multiplication leaderboard
on:
  push:
    paths:
      - '.github/workflows/score-storage-smoke.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-provision:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify free anonymous public read/write with Arabic nicknames
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,pathlib,datetime,time
          ORIGIN='https://kindasah-code.github.io'
          base='https://keyvalue.immanuel.co/api/KeyVal'
          config=pathlib.Path('multiplication/leaderboard-service.json')
          if config.exists():
              existing=json.loads(config.read_text())
              app=existing['appKey']
          else:
              with urllib.request.urlopen(urllib.request.Request(base+'/GetAppKey',headers={'Origin':ORIGIN}),timeout=15) as res:
                  assert res.headers.get('Access-Control-Allow-Origin') in ('*',ORIGIN)
                  app=json.load(res)
          assert isinstance(app,str) and len(app)>=7,repr(app)
          key='health-mathheroes-20261014'
          results=[['أحمد',12,15,37,int(time.time()*1000)],['سارة',10,10,23,int(time.time()*1000)]]
          raw=json.dumps(results,ensure_ascii=False,separators=(',',':'))
          print('Raw chars=',len(raw),'Encoded path bytes=',len(urllib.parse.quote(raw,safe='')),flush=True)
          def request(method,url):
              req=urllib.request.Request(url,method=method,headers={'Origin':ORIGIN})
              with urllib.request.urlopen(req,timeout=20) as res:
                  cors=res.headers.get('Access-Control-Allow-Origin')
                  result=json.load(res)
                  print(method,'status',res.status,'cors',cors,'value',repr(result)[:250],flush=True)
                  assert cors in ('*',ORIGIN),'Browser CORS unavailable on '+method
                  return result
          write=base+'/UpdateValue/'+app+'/'+key+'/'+urllib.parse.quote(raw,safe='')
          assert request('POST',write) is True
          received=request('GET',base+'/GetValue/'+app+'/'+key)
          if isinstance(received,str):received=json.loads(received)
          assert received==results,'Arabic results not round-tripped'
          # Replace a value to ensure game updates work
          results[1][1]=14
          raw2=json.dumps(results,ensure_ascii=False,separators=(',',':'))
          assert request('POST',base+'/UpdateValue/'+app+'/'+key+'/'+urllib.parse.quote(raw2,safe='')) is True
          received=request('GET',base+'/GetValue/'+app+'/'+key)
          if isinstance(received,str):received=json.loads(received)
          assert received==results
          config.parent.mkdir(parents=True,exist_ok=True)
          config.write_text(json.dumps({'provider':'keyvalue.immanuel.co','appKey':app,'shards':8,'lastTested':datetime.datetime.now(datetime.timezone.utc).isoformat()},indent=2)+'\n')
          print('PASS anonymous Arabic scores, save, overwrite, read, CORS. App key:',app,flush=True)
          PY
      - name: Commit public app key for the shared scoreboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add multiplication/leaderboard-service.json
          if ! git diff --cached --quiet; then
            git commit -m "Initialize anonymous classroom shared-score storage"
            git push
          fi
