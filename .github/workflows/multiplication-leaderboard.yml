name: Rotate anonymous classroom multiplication leaderboard
on:
  push:
    paths:
      - '.github/workflows/multiplication-leaderboard.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  keep-board-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Create public scoreboard if missing or expired
        run: |
          python3 - <<'PY'
          import datetime, json, pathlib, re, urllib.parse, urllib.request
          from datetime import timezone, timedelta
          p = pathlib.Path("multiplication/leaderboard-config.json")
          now = datetime.datetime.now(timezone.utc)
          if p.exists():
              try:
                  previous = json.loads(p.read_text(encoding="utf-8"))
                  expires = datetime.datetime.fromisoformat(previous["expiresAt"].replace("Z","+00:00"))
                  if previous.get("bucketId") and expires > now:
                      print("Existing board is valid until",expires)
                      raise SystemExit(0)
              except (KeyError, ValueError, json.JSONDecodeError):
                  pass
          # Anonymous public read/write bucket; no credentials embedded in GitHub Pages.
          api = "https://kvdb.io"
          form = urllib.parse.urlencode({
            "email":"245439233+kindasah-code@users.noreply.github.com",
            "default_ttl":172800
          }).encode("utf-8")
          request=urllib.request.Request(api,data=form,headers={"Content-Type":"application/x-www-form-urlencoded"},method="POST")
          with urllib.request.urlopen(request,timeout=20) as response:
              reply=response.read().decode("utf-8").strip()
          try:
              parsed=json.loads(reply)
              bid=str(parsed.get("id") or parsed.get("bucket_id") or parsed.get("bucket") or "")
          except ValueError:
              bid=reply
          bid=bid.strip().strip('"').split("/")[-1]
          if not re.fullmatch(r"[A-Za-z0-9]{16,50}",bid):
              raise RuntimeError("Provider returned an unexpected bucket id: "+repr(reply)[:160])
          key=api+"/"+bid+"/health"
          req=urllib.request.Request(key,data=b"ready",headers={"Content-Type":"text/plain"},method="PUT")
          with urllib.request.urlopen(req,timeout=20) as response:
              print("Health key stored:",response.status)
          with urllib.request.urlopen(key,timeout=20) as response:
              got=response.read().decode("utf-8")
          if got!="ready":raise RuntimeError("New bucket failed read-back")
          item={"provider":"kvdb","bucketId":bid,"createdAt":now.isoformat(),"expiresAt":(now+timedelta(hours=48)).isoformat()}
          p.write_text(json.dumps(item,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Created temporary public board, expires:",item["expiresAt"])
          PY
      - name: Publish updated scoreboard configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add multiplication/leaderboard-config.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh 48h multiplication scoreboard"
            git push
          fi
